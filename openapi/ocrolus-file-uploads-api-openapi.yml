  /v1/book/import/plaid/asset:
    post:
      summary: Import Plaid Asset Report
      operationId: import-plaid-asset-report
      description: "Import an Asset Report directly from Plaid and construct a <<glossary:Document>> from it.\n\n---\n\n\nWith fully automated workflows in mind, Ocrolus and [Plaid](https://plaid.com) offer the ability to directly import the Asset Report of any customer who has provided Bank Account details via Plaid - without you having to explicitly download and handle the JSON report.\n\nTo achieve this, Plaid will ask you to [share an Audit Copy](https://plaid.com/docs/#4-share-an-audit-copy) of the Asset Report directly with Ocrolus.\n\nNext, Ocrolus will use the provided `audit_copy_token` to extract the associated Audit Report from Plaid. This _must_ be a production token, as Ocrolus does not support sandbox tokens.\n\nThen, Ocrolus will import the Audit Report into the specified <<glossary:Book>>. \n> \U0001F4D8 \n> Creating an Audit Copy Token\n> - You can create an **Audit Copy Token** with Plaid using our auditor_id of `ocrolus`. Use this value when invoking the `createAuditCopy` function on the Plaid client object.\n\n> \U0001F6A7 \n> Due to masking of account numbers in Plaid data, we are unable to reconcile bank accounts across Plaid data and PDF bank statements. Mixing such uploads within the same book may result in duplicate bank accounts, periods and transactions."
      tags:
      - File Uploads
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - pk
              - audit_copy_token
              properties:
                pk:
                  type: integer
                  description: The <<glossary:PK>> of the <<glossary:Book>> that the constructed <<glossary:Document>> will be saved to.
                  example: 30219565
                audit_copy_token:
                  type: string
                  description: Asset Report copy token provided by Plaid.
                  example: 12345
                form_type:
                  type: string
                  description: The code identifying the type of <<glossary:Document>> that you're uploading.
                  example: PAYSTUB
                doc_name:
                  type: string
                  description: The name of the <<glossary:Document>> that will be created from the imported data. Defaults to `audit_copy_token` if not given.
              example:
                pk: 30219565
                form_type: PAYSTUB
                doc_name: example_document
      x-readme:
        samples-languages:
        - curl
        - python
        explorer-enabled: false
        code-samples:
        - language: curl
          name: Sample cURL Code
          code: "curl --request POST \"https://api.ocrolus.com/v1/book/import/plaid/asset\" \\\n    --header \"Accept: application/json\" \\\n    --header \"Authorization: Bearer <BEARER_TOKEN>\" \\\n    --form \"pk=30219565\" \\\n    --form \"audit_copy_token=123-ABC-456\" \\\n    --form \"doc_name=ExampleStatement\""
        - language: python
          name: Sample Python Code
          code: "import requests\nresponse = requests.post(\n  url = 'https://api.ocrolus.com/v1/book/import/plaid/asset',\n\n  headers = {\n    'Accept': 'application/json',\n    'Authorization': 'Bearer <BEARER_TOKEN>',\n  },\n\n  data = {\n    'pk': '30219565', # The book's primary key\n    'audit_copy_token': '12345',\n    'doc_name': 'ExampleStatement', # The name of document that will be created.\n  },\n)\nprint(response.json())"
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                Import succeeded:
                  value:
                    status: 200
                    message: OK
                    response:
                      uploaded_docs:
                      - created_ts: '2023-05-25T17:23:45Z'
                        name: 78467b0b5f0bb818a30a6d7c361385
                        checksum: 50a62f72f4b5b80b18f75fbed690dc47
                        pk: 12345
                        uuid: 8dc88eed-2b6f-414a-82f2-a99bd181cf6e
                Import failed:
                  value:
                    status: 200
                    message: OK
                    response:
                      status: 400
                      message: Plaid pull failed.
              schema:
                oneOf:
                - title: Import succeeded
                  type: object
                  properties:
                    status:
                      type: integer
                      description: A numerical code that indicates the status of the request.
                      example: 200
                      default: 0
                    message:
                      type: string
                      default: OK
                      description: A textual description that indicates details about this response's status.
                      example: OK
                    response:
                      type: object
                      description: An object received from the server that potentially contains data.
                      properties:
                        uploaded_docs:
                          type: array
                          items:
                            type: object
                            properties:
                              created_ts:
                                type: string
                                description: A timestamp of when the <<glossary:Document>> was created.
                                example: '2023-03-03T04:36:31.000Z'
                              name:
                                type: string
                                description: The name of the created <<glossary:Document>>.
                                example: 78467b0b5f0bb818a30a6d7c361385
                              checksum:
