  /v2/book/{book_uuid}/document/paystub:
    post:
      summary: Upload Pay stub PDF to Book
      operationId: upload-paystub
      description: 'Upload a known <<glossary:Pay stub>> file directly to a specific <<glossary:Book>>.


        ---

        You can upload a file to this endpoint as a `multipart/form-data` encoded payload. Visit [our guide](https://docs.ocrolus.com/reference/multipartform-data-payloads) for more information.


        If successful, the response will return the specific doc_uuid for the uploaded <<glossary:Document>>.

        > 📘

        >  - This endpoint is limited to PDF''s where the form type is expected to be a PAYSTUB.

        >  - The maximum file size allowed for upload is 200 MB.'
      tags:
      - File Uploads
      parameters:
      - name: book_uuid
        in: path
        description: The unique identifier of the <<glossary:Book>> where the uploaded file will be saved.
        required: true
        schema:
          type: string
          example: 19aab921-25a5-4beb-a59e-ac72320061d6
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - upload
              properties:
                upload:
                  type: string
                  description: The PDF file to upload.
                  format: binary
                book_uuid:
                  type: string
                  description: The unique identifier of the Book where the uploaded file will be saved.
              example:
                upload: example-pay-stub.pdf
      x-readme:
        headers:
        - key: content-type
          value: multipart/form-data
        samples-languages:
        - curl
        - python
        explorer-enabled: false
        code-samples:
        - language: curl
          name: Sample cURL Code
          code: "curl --request POST \"https://api.ocrolus.com/v2/book/{book_uuid}/document/paystub\" \\\n    --header \"Accept: application/json\" \\\n    --header \"Authorization: Bearer <BEARER_TOKEN>\" \\\n    --form \"book_uuid=19aab921-25a5-4beb-a59e-ac72320061d6\" \\\n    --form \"upload=@/path/to/paystub.pdf\""
        - language: python
          name: Sample Python Code
