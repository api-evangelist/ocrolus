  /v1/book/upload/json:
    post:
      summary: Upload aggregator JSON to Book
      operationId: upload-json
      description: "This API uploads aggregator-provided JSON data (Plaid or Finicity) to an Ocrolus <<glossary:Book>>. This endpoint supports uploading:\n\n- Plaid Asset Report JSON\n- Plaid Transactions JSON\n- Finicity JSON bundles, including accounts, transactions, customers, and institutions\n\nFor Plaid, this endpoint takes the JSON output from Plaid's [**`/transactions/get`**](https://plaid.com/docs/api/products/#transactionsget) or [**`/asset_report/get`**](https://plaid.com/docs/api/products/#asset_reportget) endpoints. To learn more, see the [Plaid integration](https://docs.ocrolus.com/docs/plaid) guide.\n\nFor Finicity, this endpoint requires a complete and internally consistent JSON bundle. Ocrolus validates references across files (accounts, customers, institutions, transactions) before generating accounts and periods. Partial Finicity uploads are not supported. To learn more, see the [Account aggregator](https://docs.ocrolus.com/docs/aggregator-finicity) guide.\n\n> \U0001F44D Tips \n  > - You can upload multiple JSON files at a time using this endpoint.\n  > - For best results, create a separate Book for each Plaid Asset Report. Do not upload JSON files alongside PDF statements, as the data may not reconcile.   \n  > - When multiple Finicity JSON files are uploaded, they are combined into a single document within the Book.\n  > - This is a shared endpoint for all both Plaid and Finicity JSON uploads. Aggregator-specific behavior is controlled using the **`aggregate_source`** parameter.\n  > - Ensure that all the Finicity JSON files originate from the same Finicity data pull and belong to the same account set.\n  > - Verify that all cross-file identifiers of Finicity (accountId, customerId, institutionId) resolve correctly.\n\n##Plaid and Finicity statement period construction\nPlaid Asset Reports do not provide explicit statement periods. Ocrolus constructs periods based on transaction dates. For example, if transactions span Jan 15 to Apr 4, statement periods are created as:\n- Jan 15 - Jan 31\n- Feb 1 - Feb 28\n- Mar 1 - Mar 31\n- Apr 1 - Apr 4\n\n> ❗️ Having unusual problems?\n  > Do not use older versions of Plaid’s Python or Ruby client libraries to access these endpoints. Users have reported access issues with outdated versions. Upgrade to the latest available client libraries before proceeding. If you believe this behavior is a bug, open a support ticket with Plaid. As a temporary workaround, use a general-purpose HTTP request library.\n"
      tags:
      - File Uploads
      parameters:
      - name: upload_intent
        in: query
        description: "Specifies the intent to process the Plaid JSON files uploaded to a Book. This parameter determines whether the uploaded transactions are simply added to the Book for analytics or actively compared against existing bank statement data to detect mismatches. \n\nThe available options to set intent are:\n- **`add_analytics`**: Adds transactions from the Plaid JSON to the Book without performing mismatch detection. Use this option for ongoing monitoring or when you only need to enrich the dataset with additional Plaid transactions. (Default if no value is specified.)\n- **`docs_to_digital`**: Runs the Docs-to-Digital algorithm. If used, the Plaid transactions are matched against bank statement data available in the Book, and any mismatches are flagged for review. Use this option when you want to perform reconciliation between digital (Plaid) and analog (PDF) sources.\n"
        example: add_analytics
        required: false
        schema:
          type: string
          enum:
          - add_analytics
          - docs_to_digital
      - name: aggregate_source
        in: query
        description: Specifies the data aggregator source used to generate the uploaded JSON. This field is case-sensitive. If no value is provided, the system defaults to `PLAID`.
        required: false
        schema:
          type: string
          enum:
          - FINICITY
          - PLAID
          default: PLAID
        example: PLAID
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - pk
              - uuid
              - upload
              properties:
                pk:
                  type: string
                  description: A unique primary key of the <<glossary:Book>> to which the uploaded JSON files will be added. This value is used interchangeably with a **`uuid`**. You must provide either **`pk`** or **`uuid`**.
                  example: 30219565
                uuid:
                  type: string
                  description: A universally unique identifier of the <<glossary:Book>> to which the uploaded JSON files will be added. This value is used interchangeably with a **`pk`**. You must provide either **`uuid`** or **`pk`**.
                  example: a385be19-2d1a-4846-918c-0d3125a885c8
                upload:
                  type: string
                  format: binary
                  description: The JSON file containing Plaid Asset Report or Transaction data. This should be the direct output from Plaid's API.
                  example: <JSON binary data>
                accounts:
                  type: string
                  format: binary
                  description: "JSON files containing Finicity account data. This file is used to create bank account information associated with the Book. Must be valid JSON. \n\nTo learn more about uploading Finicity JSON file containing account details, see the [Uploading Finicity JSON to Ocrolus](https://docs.ocrolus.com/docs/aggregator-finicity#uploading-finicity-json-to-ocrolus) guide.\n"
                  example: <JSON binary data>
                transactions:
                  type: string
                  format: binary
                  description: 'JSON file containing Finicity transaction data. This file is used to create period and transaction data for the associated bank accounts identified in the accounts JSON. Must be valid JSON.


                    To learn more about uploading Finicity JSON file containing transaction details, see the [Uploading Finicity JSON to Ocrolus](https://docs.ocrolus.com/docs/aggregator-finicity#uploading-finicity-json-to-ocrolus) guide.

                    '
                  example: <JSON binary data>
                customers:
                  type: string
                  format: binary
                  description: 'JSON file containing Finicity customer data. It is used to associate customer information with the uploaded bank accounts and transactions. The account holder name is extracted from this JSON. Must be valid JSON.


                    To learn more about uploading Finicity JSON file containing customer details, see the [Uploading Finicity JSON to Ocrolus](https://docs.ocrolus.com/docs/aggregator-finicity#uploading-finicity-json-to-ocrolus) guide.

                    '
                  example: <JSON binary data>
                institutions:
                  type: string
                  format: binary
                  description: 'JSON files containing Finicity institution data. It is used to map accounts to their respective financial institutions (banks). Must be valid JSON.


                    To learn more about uploading Finicity JSON file containing institution details, see the [Uploading Finicity JSON to Ocrolus](https://docs.ocrolus.com/docs/aggregator-finicity#uploading-finicity-json-to-ocrolus) guide.

                    '
                  example: <JSON binary data>
                doc_name:
                  type: string
                  description: The name of the <<glossary:Document>> created from the uploaded data. If omitted, defaults to **`audit_copy_token`**.
                  example: test doc
      x-readme:
        samples-languages:
        - curl
        - python
        headers:
        - key: content-type
          value: multipart/form-data
        explorer-enabled: false
        code-samples:
        - language: curl
          name: Sample cURL Code
          code: "curl --request POST \"https://api.ocrolus.com/v1/book/upload/json?upload_intent=add_analytics\" \\\n  --header \"Accept: application/json\" \\\n  --header \"Authorization: Bearer <BEARER_TOKEN>\" \\\n  --form \"pk=1234567\" \\\n  --form \"upload=@/path/to/asset-report.json\""
        - language: python
          name: Sample Python Code
          code: "import requests\n\n  url = \"https://api.ocrolus.com/v1/book/upload/json\"\n  params = {\n      \"upload_intent\": \"add_analytics\"\n  }\n  headers = {\n      \"Accept\": \"application/json\",\n      \"Authorization\": \"Bearer <BEARER_TOKEN>\"\n  }\n  files = {\n      \"pk\": (None, \"1234567\"),\n      \"upload\": open(\"/path/to/asset-report.json\", \"rb\")\n  }\n\n  response = requests.post(url, headers=headers, params=params, files=files)\n\n  print(response.status_code)\n  print(response.json())"
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Successful Upload:
                  value:
                    status: 200
                    response:
                      uploaded_docs:
                      - pk: 2203941
