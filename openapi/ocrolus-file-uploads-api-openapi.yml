                      status: 400
                      message: plaid-asset-and-txn.json is not a valid JSON
                    message: OK
                Unsupported Format:
                  value:
                    status: 200
                    response:
                      status: 400
                      message: 'plaid-asset.json -- json format is not supported

                        '
                    message: OK
                Document Already Exists:
                  value:
                    status: 200
                    response:
                      status: 400
                      message: 'plaid-asset.json already exists

                        '
                    message: OK
                Multiple Errors:
                  value:
                    status: 200
                    response:
                      status: 400
                      message: "plaid-asset.json already exists\n txn.json is not a valid json\n"
                    message: OK
              schema:
                oneOf:
                - title: Successful Upload
                  type: object
                  properties:
                    status:
                      type: integer
                      description: A numerical code that indicates the status of the request.
                      example: 200
                    response:
                      type: object
                      description: An object received from the server that potentially contains data.
                      properties:
                        uploaded_docs:
                          type: array
                          items:
                            type: object
                            properties:
                              pk:
                                type: integer
                                description: The primary key of the <<glossary:Document>>.
                              uuid:
                                type: string
                                example: 8dc88eed-2b6f-414a-82f2-a99bd181cf6e
                                description: Universally unique identifier (uuid) of the uploaded <<glossary:Document>>.
                              name:
                                type: string
                                description: Name of the <<glossary:Document>>.
                                example: plaid-asset-and-txn.json
                              checksum:
                                type: string
                                description: An alphanumerical value used to determine the authenticity of the data.
                                example: 50a62f72f4b5b80b18f75fbed690dc47
                              created_ts:
                                type: string
                                description: The timestamp at which the <<glossary:Document>> was created.
                                example: '2023-05-25T17:23:45Z'
                              id:
                                type: integer
                                description: Unique primary key of the uploaded <<glossary:Document>>.
                                default: 0
                    message:
                      type: string
                      description: A textual description that indicates details about this response's status.
                      example: OK
                - title: Error
                  type: object
                  properties:
