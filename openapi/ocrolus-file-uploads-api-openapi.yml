  /v1/book/upload/image:
    post:
      summary: Upload Image to Book
      operationId: upload-image
      description: "Upload image files to a <<glossary:Book>>.\n\n--- \n\nYou can upload a file to this endpoint as a `multipart/form-data` encoded payload. Visit [our guide](https://docs.ocrolus.com/reference/multipartform-data-payloads) for more information.\n\nWith the capability to classify images, you can upload a single image using this endpoint. To upload multiple images to the same <<glossary:Book>>, call this endpoint once for each image, and then call the [Finalize image group](ref:mark-image-group-complete) endpoint to complete the image group. \n\nWe support uploads of the images in the **JPEG**, **PNG**, **BMP**, and **TIFF** (Single-image files only) formats.   \n\n> \U0001F4D8 \n> The term **image group** refers to a collection of images that may consist of one or more images."
      tags:
      - File Uploads
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - upload
              properties:
                upload:
                  type: string
                  description: The image file that you want to upload. The maximum file size is 200 MB.
                  format: binary
                book_uuid:
                  type: string
                  description: Universally unique identifier (uuid) of the <<glossary:Book>> to which the uploaded images will be saved to. Mutually exlusive with `pk`.
                  example: 19aab921-25a5-4beb-a59e-ac72320061d6
                pk:
                  type: string
                  description: Unique primary key (<<glossary:PK>>) of the <<glossary:Book>> to which the uploaded images will be saved to. Mutually exlusive with `book_uuid`.
                  example: 30219565
                return_image_pk:
                  type: boolean
                  description: Indicates if the response will include the PK of the uploaded image.
                  example: true
              example:
                pk: 30219565
                book_uuid: 19aab921-25a5-4beb-a59e-ac72320061d6
                return_image_pk: true
