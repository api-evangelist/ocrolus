              description: 'Minimum debits (withdrawals) across the three most recent calendar months.

                '
            debit_max_3m:
              type: number
              example:
              - 37995.79
              description: 'Maximum debits (withdrawals) across the three most recent calendar months.

                '
            debit_std_3m:
              type: number
              example:
              - 9887.97
              description: 'Volatility of debits (withdrawals) across the three most recent calendar months.

                '
            debit_cv_3m:
              type: number
              example:
              - 0.4
              description: 'Standardized volatility of debits (withdrawals) across the three most recent calendar months.

                '
            payroll_pmts_avg_1m:
              type: number
              example:
              - 1454.88
              description: 'Payroll payments in the most recent calendar month.

                '
            payroll_pmts_avg_3m:
              type: number
              example:
              - 5401.97
              description: 'Average payroll payments across the three most recent calendar months.

                '
            payroll_pmts_min_3m:
              type: number
              example:
