              overdraft_divisor:
                type: number
                description: Calculated amount for a single overdraft fee.\nThe common divisor is defined as "the least common multiple (in 0.50 increments) of amount values corresponding to transactions with overdraft = True".\nThis multiple must fall between 25 and 60 (inclusive) otherwise overdraft = None and no scaling occurs.
              overdraft_raw_fee_count_by_month:
                type: array
