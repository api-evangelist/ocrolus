  /v2/book/{book_uuid}/credit-shopping-events:
    get:
      summary: Credit shopping events
      operationId: credit-shopping-events
      description: 'This API retrieve credit shopping events (CSE) for an SMB <<glossary:Book>>. It groups a merchant''s loan inquiries into clusters to give lenders visibility into how frequently and how recently the merchant has shopped for credit. The response includes two velocity views — individual loan inquiries and grouped credit-shopping events, along with the full list of events and their anonymized lender inquiry timestamps.

        '
      tags:
      - Cash Flow Analytics
      parameters:
      - name: book_uuid
        in: path
        required: true
        description: 'The unique identifier of the <<glossary:Book>>.

          '
        schema:
          type: string
        example: 3927d5b7-ca34-4882-b23f-0ce40d40027c
      x-readme:
        samples-languages:
        - curl
        - python
        explorer-enabled: false
      x-retries:
        idempotent: true
        retry_on:
        - 500
        - 502
        - 503
        - 504
        do_not_retry_on:
        - 400
        - 401
        - 404
        strategy: exponential_backoff
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                title: Success
                properties:
                  business_id:
                    type: string
                    description: The unique identifier of the SMB entity resolved from the Book.
                  business_name:
                    type: string
                    description: The name of the SMB entity.
                  loan_inquiry_velocity:
                    type: object
                    description: 'Count of individual loan inquiries attributed to the SMB within each rolling window, measured back from today.

                      '
                    properties:
                      day_count_30:
                        type: integer
                        description: Number of loan inquiries in the last 30 days.
                      day_count_60:
                        type: integer
                        description: Number of loan inquiries in the last 60 days.
                      day_count_90:
                        type: integer
                        description: Number of loan inquiries in the last 90 days.
                      day_count_180:
                        type: integer
                        description: Number of loan inquiries in the last 180 days.
                      day_count_270:
                        type: integer
                        description: Number of loan inquiries in the last 270 days.
                      day_count_365:
                        type: integer
                        description: Number of loan inquiries in the last 365 days.
                  credit_shopping_velocity:
                    type: object
                    description: 'Count of Credit Shopping Events (grouped inquiry clusters) within each rolling window. A single event may contain multiple individual inquiries, so these counts will always be less than or equal to the corresponding `loan_inquiry_velocity` counts.

                      '
                    properties:
                      day_count_30:
                        type: integer
                        description: Number of Credit Shopping Events in the last 30 days.
                      day_count_60:
                        type: integer
                        description: Number of Credit Shopping Events in the last 60 days.
                      day_count_90:
                        type: integer
                        description: Number of Credit Shopping Events in the last 90 days.
                      day_count_180:
                        type: integer
                        description: Number of Credit Shopping Events in the last 180 days.
                      day_count_270:
                        type: integer
                        description: Number of Credit Shopping Events in the last 270 days.
                      day_count_365:
                        type: integer
                        description: Number of Credit Shopping Events in the last 365 days.
                  credit_shopping_events:
                    type: array
                    description: 'One object per Credit Shopping Event, ordered by `first_inquiry_ts`. Each event represents a cluster of loan inquiries grouped by proximity in time. Events are bucketed by the first application date in the chain.

                      '
                    items:
                      type: object
                      properties:
                        first_inquiry_ts:
                          type: string
                          format: date-time
                          description: 'ISO 8601 timestamp of the first inquiry in the event. Marks the start of the credit-shopping chain.

                            '
                        last_inquiry_ts:
                          type: string
                          format: date-time
                          description: 'ISO 8601 timestamp of the last inquiry in the event. Equal to first_inquiry_ts when the event contains a single inquiry (duration_days: 0).

                            '
                        duration_days:
                          type: integer
                          description: 'Span of the event in days, calculated as the difference between first_inquiry_ts and last_inquiry_ts. Returns 0 when all inquiries occurred on the same day.

                            '
                        inquiry_count:
                          type: integer
                          description: Total number of loan inquiries in the event across all lenders.
                        unique_lender_count:
                          type: integer
                          description: Number of distinct lenders (organizations) that appear in the event.
                        lenders:
                          type: array
                          description: 'One entry per distinct, anonymized lender in the event. Lender identities are not exposed; only their inquiry timestamps are returned.

                            '
                          items:
                            type: object
                            properties:
                              application_history:
                                type: array
                                description: 'ISO 8601 timestamps of each inquiry made by this lender within the event, in chronological order.

                                  '
                                items:
                                  type: string
                                  format: date-time
              examples:
                Success:
                  value:
                    business_id: <BUSINESS_ID>
                    business_name: Acme LLC
                    loan_inquiry_velocity:
                      day_count_30: 8
                      day_count_60: 14
                      day_count_90: 20
                      day_count_180: 32
                      day_count_270: 44
                      day_count_365: 56
                    credit_shopping_velocity:
                      day_count_30: 3
                      day_count_60: 4
                      day_count_90: 6
                      day_count_180: 9
                      day_count_270: 12
                      day_count_365: 15
                    credit_shopping_events:
                    - first_inquiry_ts: '2024-03-12T00:00:00Z'
                      last_inquiry_ts: '2024-03-12T00:00:00Z'
                      duration_days: 0
                      inquiry_count: 1
                      unique_lender_count: 1
                      lenders:
                      - application_history:
                        - '2024-03-12T00:00:00Z'
                    - first_inquiry_ts: '2026-04-18T00:00:00Z'
                      last_inquiry_ts: '2026-05-08T00:00:00Z'
                      duration_days: 20
                      inquiry_count: 5
                      unique_lender_count: 2
                      lenders:
                      - application_history:
                        - '2026-04-18T00:00:00Z'
                        - '2026-04-25T00:00:00Z'
                        - '2026-05-01T00:00:00Z'
                        - '2026-05-08T00:00:00Z'
                      - application_history:
