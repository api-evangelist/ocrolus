          description: Success
          content:
            application/json:
              schema:
                properties:
                  book_uuid:
                    type: string
                    description: Unique identifier of the <<glossary:Book>>.
                    example:
                    - caaa57ba-8909-4a05-9dcc-e7cc057e3c48
                    format: uuid
                  proba_default:
                    type: string
                    description: The probability of default as a number between 0 and 1, which depicts the likelihood a borrower might default on the loan.
