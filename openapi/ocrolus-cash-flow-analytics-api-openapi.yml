  /v2/analytics/jobs/{job_id}:
    get:
      summary: Async job status
      operationId: async-job-status
      tags:
      - Cash Flow Analytics
      description: 'Retrieves the status and result of an analytics job created when any supported analytics endpoint is called with **`async=true`**. Poll this endpoint until the job reaches a terminal state (`DONE` or `FAILED`).


        The job **`status`** moves through the following states: **`PENDING`** while the job is running, **`DONE`** when the result is ready, and **`FAILED`** if the job could not be completed. Poll every few seconds until a terminal state is reached. Large Books may take longer to process.


        When the status is **`DONE`**, the response includes a **`result_url`**, a temporary pre-signed download link to retrieve the analytics payload, which is identical in shape to the corresponding synchronous endpoint''s response. The job and its **`result_url`** are valid for 24 hours from the time the job was created.

        '
      parameters:
      - name: job_id
        in: path
        required: true
        description: 'The job ID returned in the `202` response when the async request was submitted.

          '
        schema:
          type: string
          format: uuid
        example: 0f2b9c3a-9d1e-4c1a-9d2e-2c9a1b3c4d5e
      x-readme:
        samples-languages:
        - curl
        - python
        explorer-enabled: false
      responses:
        '200':
          description: 'The job is complete. Fetch the `result_url` to download the analytics payload. The URL expires 24 hours after the job was created.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    format: uuid
                    description: The unique identifier of the async job.
                    example: 0f2b9c3a-9d1e-4c1a-9d2e-2c9a1b3c4d5e
                  status:
                    type: string
                    enum:
                    - DONE
                    description: The job completed successfully.
                    example: DONE
                  result_url:
                    type: string
                    format: uri
                    description: 'A temporary pre-signed link to download the analytics payload. Expires 24 hours after the job was created.

                      '
                    example: https://.../async_jobs/0f2b9c3a...?X-Amz-Signature=...
              examples:
                OK — complete:
                  $ref: '#/components/examples/AsyncJobDone'
        '202':
          description: 'The job is still running. Keep polling until the status changes to `DONE` or `FAILED`.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    format: uuid
                    description: The unique identifier of the async job.
                    example: 0f2b9c3a-9d1e-4c1a-9d2e-2c9a1b3c4d5e
                  status:
                    type: string
                    enum:
                    - PENDING
                    description: 'The job is in progress. Poll again after a few seconds.

                      '
                    example: PENDING
              examples:
                Accepted — still processing:
                  $ref: '#/components/examples/AsyncJobPending'
        '404':
          description: The job ID is not recognized, does not belong to your organization, or has expired. Jobs expire 24 hours after creation.
          content:
            application/json:
              schema:
                description: Not Found
                type: object
                properties:
                  job_id:
                    type: string
                    format: uuid
                    description: The job ID that was not found.
                  error:
                    type: string
                    description: A description of why the job ID could not be found.
              examples:
                Job not found:
                  $ref: '#/components/examples/AsyncJobNotFound'
        '422':
          description: 'The job failed. The `error` field explains why. For example, a book that exceeds 1,000,000 transactions is rejected with `422`.

            '
          content:
            application/json:
              schema:
                description: FAILED
                type: object
                properties:
                  job_id:
                    type: string
                    format: uuid
                    description: The unique identifier of the async job.
                    example: 0f2b9c3a-9d1e-4c1a-9d2e-2c9a1b3c4d5e
                  status:
                    type: string
                    enum:
                    - FAILED
                    description: The job failed.
                    example: FAILED
                  error:
                    type: string
                    description: A description of why the job failed.
                    example: Book transaction count exceeds the maximum supported by the async serving path
              examples:
                Job failed:
                  $ref: '#/components/examples/AsyncJobFailed'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                properties:
                  status:
                    type: integer
                    description: A numerical code that indicates the status of the request.
                  message:
                    type: string
                    description: A textual description that indicates details about this response's status.
              examples:
                internal_server_error:
                  value:
                    status: 500
                    message: Internal Server Error.
