          example: 324
        naics4_code:
          type: integer
          description: A 4-digit North American Industry Classification System (NAICS) code that represents the industry of the Book.
          example: 7225
        naics_description:
          type: string
          description: "\nThe description of the 4-digit NAICS code, indicating the industry classification of the Book category.\n\n  > \U0001F4D8 In Books with multiple businesses or fragmented merchant activity, the widget may show the following statuses as applicable:\n  > - **`Pending - Industry Data`**: Classification is in progress.  \n  > - **`Unable to find a unique SMB merchant`**: The system is not able to find a unique merchant mapped to the documents in the Book.  \n  > - **`Not Available`**: The system has found a unique merchant, but this merchant does not have industry classification data.\n"
          example: Restaurants and Other Eating Places
        naics6_code:
          type: integer
          description: A six-digit NAICS code that provides a more granular industry classification for the merchant. This code refines the broader NAICS category and is commonly used for detailed industry analysis, peer comparisons, and benchmarking.
          example: 7225
        naics6_description:
          type: string
          description: A human-readable description of the six-digit NAICS code that specifies the merchant’s exact industry segment within the broader NAICS classification.
          example: Snack and Nonalcoholic Beverage Bars
        naics_override:
          type: boolean
          description: Shows if the 4-digit NAICSA code was overriden by the lender.
          example: true
        mcc_code:
          type: integer
          description: A four-digit code assigned by payment networks that classifies a merchant based on the primary type of goods or services they provide. Merchant Category Code (MCC) are commonly derived from card transaction data and are used for transaction categorization, risk assessment, and analytics.
          example: 7225
        mcc_description_:
          type: string
          description: A human-readable description of the MCC that explains the merchant’s primary business activity as defined by the card network.
          example: Snack and Nonalcoholic Beverage Bars
        sic_code:
          type: integer
          description: A four-digit Standard Industrial Classification (SIC) code that identifies the merchant’s primary business activity using the legacy SIC system. SIC codes are derived from bank statement data and are used for industry classification, regulatory reporting, and analytics.
          example: 172
        sic_description_:
          type: string
          description: A human-readable description of the SIC code that explains the merchant’s primary industry classification under the SIC system.
          example: GRAPES
        loan_inquiries:
          type: object
          description: 'Summary of loan applications made by the SMB entity, including application history and application velocity over various time windows.

            '
          properties:
            smb_entity_name:
              type: string
              description: Merchant name derived from the account holder name in the bank statement.
              example: ABC Corp
            total_applications:
              type: integer
              description: Total number of applications Ocrolus has seen for the merchant, up to the creation time of the current Book.
              example: 3
            application_history:
              type: array
              description: List of prior application timestamps for the merchant, shown in descending order.
              items:
                type: object
                properties:
                  created_ts:
                    type: string
                    format: date-time
                    description: The timestamp when the loan application was created.
                    example: '2025-10-10T12:00:00Z'
            velocity:
              type: object
              description: Number of applications the merchant has submitted within trailing time windows (30–365 days).
              properties:
                30_day_count:
                  type: integer
                  description: Number of applications in the last 30 days.
                  example: 2
                60_day_count:
                  type: integer
                  description: Number of applications in the last 60 days.
                  example: 2
                90_day_count:
                  type: integer
                  description: Number of applications in the last 90 days.
                  example: 3
                180_day_count:
                  type: integer
                  description: Number of applications in the last 180 days.
                  example: 3
                270_day_count:
                  type: integer
                  description: Number of applications in the last 270 days.
                  example: 3
                365_day_count:
                  type: integer
                  description: Number of applications in the last 365 days.
                  example: 3
        book_mismatch_severity:
          type: string
          description: 'The severity of mismatches detected in the Book, such as discrepancies between uploaded documents and extracted data. Possible values include Low, Medium, and High.

            > 📘 **This attribute is in beta. If you encounter any bug, please reach out to support@ocrolus.com.**

            '
          example: high
