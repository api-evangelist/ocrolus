  /v2/book/{book_uuid}/enriched_txns:
    get:
      summary: Enriched transactions
      operationId: enriched-transactions
      description: "\nThis API provides categorizations for each transaction in the requested <<glossary:Book>>. It's the building block for all the Cash Flow Analytics products. It contains a comprehensive list of categories, accurate Transaction tagging, and improved revenue, expense, and transfer logic.\n\n---\n\n### Async processing \n\nThis API supports asynchronous processing. To get the asynchronous result, add `async=true` in the query parameter to run the request as a background job and receive a `job_id` immediately instead of waiting for the full response inline. When `async=true`, the endpoint returns `202 Accepted` with a `job_id` instead of the analytics payload.\n\nAsync mode is required for Books with more than 100,000 transactions. Books exceeding 1,000,000 transactions are rejected with `422` (error code `1100`). Once submitted, poll\n[Async job status](https://docs.ocrolus.com/reference/async-job-status) API to retrieve the result when the job is complete.\n"
      tags:
      - Cash Flow Analytics
      parameters:
      - name: book_uuid
        in: path
        required: true
        description: 'The unique identifier of the <<glossary:Book>> that you''d like to analyze.

          '
        schema:
          type: string
          format: uuid
        example: 3927d5b7-ca34-4882-b23f-0ce40d40027c
      - name: offset
        in: query
        description: The starting point (number of records to skip) from the latest transaction to fetch results.
        example: 1
        schema:
          type: integer
      - name: limit
        in: query
        description: The maximum number of records to be fetched starting from the specified `offset` value.
        example: 50
        schema:
          type: integer
      - name: include_pending_plaid_transactions
        in: query
        description: "Provides an option to include pending transactions in the response. When set to `true`, the response payload includes an additional `pending_plaid_transactions` field listing currently pending transactions for the Book’s Plaid-linked accounts.\n\nPending Plaid transactions are transactions that the financial institution has reported to Plaid but which have not yet posted to the account. For example, card authorizations that have not cleared, or ACH debits still in flight. Including them gives you early visibility into recent activity that will eventually appear in the posted transaction set.\n\n> \U0001F4D8 Note \n> - Pending transactions are surfaced for visibility only. They are not processed through Ocrolus’s enrichment pipeline and therefore do not include tags, categories, or counterparties.\n> - These transactions are excluded from all analytics outputs. Cash flow features, Book summaries, risk scores, lender analytics, and analytics exports are computed only from posted transactions.  \n> - Once a pending transaction posts at the financial institution, it is processed through enrichment and appears in the standard posted transaction set on the next refresh. The pending entry is then removed.      \n"
        example: false
        schema:
          type: boolean
          default: false
          enum:
          - true
          - false
      - $ref: '#/components/parameters/AsyncParameter'
      x-readme:
        samples-languages:
        - curl
        - python
        explorer-enabled: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnrichedTxnsSchema'
              examples:
                Success:
                  $ref: '#/components/examples/SuccessEnrichedTxnsResponse'
        '202':
          description: Accepted
          content:
            application/json:
              examples:
                Accepted:
                  $ref: '#/paths/~1v2~1book~1%7Bbook_uuid%7D~1summary/get/responses/202/content/application~1json/examples/Accepted'
              schema:
                $ref: '#/paths/~1v2~1book~1%7Bbook_uuid%7D~1summary/get/responses/202/content/application~1json/schema'
        '403':
          description: Permission Error
          content:
            application/json:
              examples:
                No Permission:
                  $ref: '#/components/examples/BookPermissionError'
              schema:
                $ref: '#/paths/~1v2~1book~1%7Bbook_uuid%7D~1summary/get/responses/400/content/application~1json/schema'
        '404':
          description: No Data Found
          content:
            application/json:
              examples:
                Book not found:
                  $ref: '#/components/examples/BookNotFoundError'
                Transactions not found:
                  $ref: '#/components/examples/TransactionsNotFoundError'
              schema:
                $ref: '#/paths/~1v2~1book~1%7Bbook_uuid%7D~1summary/get/responses/400/content/application~1json/schema'
        '422':
          description: Book Contains More Than 100k Transactions
          content:
            application/json:
              examples:
                Transaction limit exceeded:
                  $ref: '#/components/examples/TxnLimitExceededError'
              schema:
                $ref: '#/paths/~1v2~1book~1%7Bbook_uuid%7D~1summary/get/responses/400/content/application~1json/schema'
        '425':
          description: Analytics Still Processing
          content:
            application/json:
              examples:
                Book not found:
                  $ref: '#/components/examples/TxnTagsProcessingError'
              schema:
                $ref: '#/paths/~1v2~1book~1%7Bbook_uuid%7D~1summary/get/responses/400/content/application~1json/schema'
  /v2/book/{book_uuid}/lender_analytics/xlsx:
    get:
      summary: SMB analytics (Excel)
