  /v2/analytics/book/{book_uuid}/benchmark:
    get:
      summary: Cash flow benchmarking (CFB)
      operationId: benchmarking-CFB
      description: 'Retrieve benchmarking percentiles for an SMB <<glossary:Book>>. The endpoint ranks the Book against anonymized peers across four metrics: revenue, expenses, fintech inflows, and fintech outflows. Use optional query parameters to shape the peer group by time window, geography, and industry granularity.


        > 🚧 Early access!

        > This feature is available through early access. To enable either feature for your organization, contact your Account Manager.


        > 📘 Peer-group validity

        > Results are returned only when the peer group contains 30 or more Books. Opted-out organizations are excluded before computation. The same inputs return identical results across the API and the Dashboard.

        '
      tags:
      - Cash Flow Analytics
      parameters:
      - name: book_uuid
        in: path
        required: true
        description: 'The unique identifier of the <<glossary:Book>>.

          '
        schema:
          type: string
        example: 3927d5b7-ca34-4882-b23f-0ce40d40027c
      - name: time_window_days
        in: query
        required: false
        schema:
          type: integer
          default: 90
          enum:
          - 30
          - 60
          - 90
          - 180
          - 270
          - 365
        description: 'Rolling window, in days, measured back from the Book''s creation date. Sets the period over which the Book''s metrics and the peer distribution are computed.

          '
      - name: geography_type
        in: query
        required: false
        schema:
          type: string
          default: national
          enum:
          - national
          - state
          - msa
        description: 'Geographic scope of the peer group. `msa` uses metropolitan statistical area codes.

          '
      - name: geography_code
        in: query
        required: false
        schema:
          type: string
          default: ALL
          enum:
          - ALL
          - AL
          - AK
          - AZ
          - AR
          - CA
          - CO
          - CT
          - DE
          - DC
          - FL
          - GA
          - GU
          - HI
          - ID
          - IL
          - IN
          - IA
          - KS
          - KY
          - LA
          - ME
          - MD
          - MA
          - MI
          - MN
          - MS
          - MO
          - MT
          - NE
          - NV
          - NH
          - NJ
          - NM
          - NY
          - NC
          - ND
          - MP
          - OH
          - OK
          - OR
          - PA
          - PR
          - RI
          - SC
          - SD
          - TN
          - TX
          - TU
          - TV
          - UT
          - VA
          - VI
          - WA
          - WV
          - WI
          - WY
        description: 'Geographic identifier for the peer group: a state abbreviation (e.g., `NY`), an MSA code, or `ALL`. Must not be `ALL` when `geography_type` is `state` or `msa`.

          '
      - name: industry_level
        in: query
        required: false
        schema:
          type: string
          default: naics4
          enum:
          - naics2
          - naics4
          - naics6
        description: <<glossary:NAICS>> granularity used to build the peer group.
      - name: industry_code
        in: query
        required: false
        schema:
          type: string
        description: 'NAICS code matching `industry_level`. Required as a 6-digit code when `industry_level` is `naics6`. Otherwise derived from the Book''s NAICS data.

          '
      x-readme:
        samples-languages:
        - curl
        - python
        explorer-enabled: false
      x-retries:
        idempotent: true
        retry_on:
        - 500
        - 502
        - 503
        - 504
        do_not_retry_on:
        - 400
        - 401
        strategy: exponential_backoff
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                title: Success
                properties:
                  book_uuid:
                    type: string
                    description: The Book for which benchmarking ran.
                  book_created_ts:
                    type: string
                    format: date-time
                    description: ISO 8601 timestamp of the Book's creation. The `time_window_days` window is measured back from this point.
                  dimensions:
                    type: object
                    description: The peer-group dimensions the endpoint resolved for this request.
                    properties:
                      time_window_days:
                        type: integer
                        description: The time window applied, in days.
                      geography_type:
                        type: string
                        enum:
                        - national
                        - state
                        - msa
                        description: Geographic scope of the peer group.
                      geography_code:
                        type: string
                        description: The resolved geography code, or `ALL` for national.
                      industry_level:
                        type: string
                        enum:
                        - naics2
                        - naics4
                        - naics6
                        description: NAICS granularity used to build the peer group.
                      industry_code:
                        type: string
                        description: The NAICS code used for the peer group.
                  metrics:
                    type: array
                    description: One object per benchmarked metric.
                    items:
                      type: object
                      properties:
                        metric:
                          type: string
                          enum:
                          - revenue
                          - expense
                          - fintech_inflows
                          - fintech_outflows
                          description: The benchmarked financial metric.
                        value:
                          type: number
                          description: The Book's actual value for that metric over the window.
                        percentile:
                          type: number
                          minimum: 0
                          maximum: 100
                          description: The Book's percentile rank (0–100) within the peer group, returned as a decimal (e.g., `75.8`).
              examples:
                Success:
                  value:
                    book_uuid: <BOOK_UUID>
                    book_created_ts: '2026-06-04T09:58:37.481615Z'
                    dimensions:
                      time_window_days: 90
                      geography_type: national
