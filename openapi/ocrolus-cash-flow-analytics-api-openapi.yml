              nsf_returned_or_not_paid_fee_count_by_month:
                type: array
                description: Non-sufficient funds (NSF) fees returned or not paid fees count grouped by calendar month.
              periods:
                type: object
                description: 'A list of statement periods covered by the Book. Each period represents the date range of a single bank statement.


                  **Reconciliation field behavior**

                  When `reconciled` is `true`, `recon_error_absolute_amount` is `null` or `0` and all other recon fields are `null`.


                  When `reconciled` is `false`, `recon_error_absolute_amount` is populated and remaining recon fields are populated where available.


                  Reconciliation values are consistent with the transactions endpoint.

                  '
                properties:
                  begin_date:
                    type: string
                    description: The start date of the statement period retrieved from the summary section of a bank statement.
                  end_date:
                    type: string
                    description: The end date of the statement period retrieved from the summary section of a bank statement.
                  begin_balance:
                    type: number
                    description: The initial balance of the statement period retrieved from the summary section of a bank statement.
                  end_balance:
                    type: number
                    description: The final balance of the statement period retrieved from the summary section of a bank statement.
                  txn_count:
                    type: integer
                    description: The count of transactions that were included in the analytics calculation for this particular period.
                  uploaded_doc_pk:
                    type: integer
                    description: The unique identifier of the document from which this transaction is captured.
                  average_amount:
                    type: number
                    description: The mean absolute amount of transactions within a given statement period.
                  average_daily_balance:
                    type: number
                    description: The average daily ending balance including weekends.
                  average_daily_cash_flow:
                    type: number
                    description: The mean daily net cash flow, calculated as the difference between total credits and total debits. The `Net Cash Flow = Credits - Debits`.
                  average_deposit:
                    type: number
                    description: The average amount of credit transactions.
                  deposit_sum:
                    type: number
                    description: The overall amount credit during the specified period.
                  deposit_count:
                    type: integer
                    description: The total number of deposit occurrences during the specified period.
                  withdrawal_sum:
                    type: number
                    description: The overall amount withdrawn during the specified period.
                  withdrawal_count:
                    type: integer
                    description: The total count of withdrawals during the specified period.
                  revenue:
                    type: number
                    description: Total revenue of the business.
                  negative_balances_weekday:
                    type: array
                    description: Days in which the daily ending balance fell below zero.
                  nsf_fee_sum:
                    type: integer
                    description: The sum of all NSF fee amounts in the statement period.
                  nsf_fee_count:
                    type: integer
                    description: The number of NSF occurrences in the statement period.
                  nsf_raw_fee_count:
                    type: integer
                    description: The total NSF fee count (NOT including common divisor logic) in statement period.
                  overdraft_fee_sum:
                    type: integer
                    description: The sum of all overdraft fee amounts in the statement period.
                  overdraft_fee_count:
                    type: integer
                    description: The number of overdraft occurrences in the statement period.
                  overdraft_raw_fee_count:
                    type: integer
                    description: The total overdraft fee count (NOT including common divisor logic) in statement period.
                  returned_item_deposit_count:
                    type: integer
                    description: The total number of returned item credits.
                  returned_item_withdrawal_count:
                    type: integer
                    description: The total number of returned item debits.
                  has_weekend_txn:
                    type: boolean
                    description: Indicates if any transactions occured on a weekend.
                  nsf_divisor:
                    type: integer
                    description: The calculated amount for a single NSF fee.
                  overdraft_divisor:
                    type: integer
                    description: The calculated amount for a single overdraft fee.
                  max_deposit:
                    type: number
                    nullable: true
                    description: The highest single deposit amount recorded during the period.
                  average_withdrawal:
                    type: number
                    nullable: true
                    description: The average withdrawal amount across all withdrawals during the period. Returned as a negative value.
                  max_withdrawal:
                    type: number
                    nullable: true
                    description: The largest single withdrawal amount recorded during the period. Returned as a negative value.
                  revenue_count:
                    type: integer
                    nullable: true
                    description: The total number of transactions tagged as revenue during the period.
                  revenue_deduction:
                    type: number
                    nullable: true
                    description: The total amount deducted from gross revenue during the period based on the active revenue formula.
                  expense:
                    type: number
                    nullable: true
                    description: The total amount of transactions tagged as expenses during the period. Returned as a negative value.
                  expense_count:
                    type: integer
                    nullable: true
                    description: The total number of transactions tagged as expenses during the period.
                  negative_balances:
                    type: array
                    nullable: true
                    description: A list of dates within the period on which the account balance was negative. Returns an empty array if no negative balances were recorded.
                  nsf_days_count:
                    type: integer
                    nullable: true
                    description: The number of days within the period on which a non-sufficient funds (NSF) event was recorded.
                  overdraft_days_count:
                    type: integer
                    nullable: true
                    description: The number of days within the period on which an overdraft event was recorded.
                  nsf_or_overdraft_days_count:
                    type: integer
                    nullable: true
                    description: The total number of days within the period on which either an NSF or overdraft event was recorded.
                  large_deposits:
                    type: number
                    nullable: true
                    description: The total amount of deposits considered large during the period, based on Ocrolus thresholds.
                  reconciled:
                    type: boolean
                    description: Whether the statement period reconciled successfully. `true` means the opening and closing balances match the transactions, and `false` means a discrepancy was detected.
                  recon_error_absolute_amount:
                    type: number
                    nullable: true
                    description: The dollar amount of the reconciliation discrepancy for the period. Returns null or 0 when the period reconciled or returns the discrepancy amount when it did not.
                  recon_error_pct_of_average_daily_balance:
                    type: number
                    nullable: true
                    description: The reconciliation discrepancy expressed as a percentage of the average daily balance. Helps you identify the relative size of the error. Returns null when the period reconciled or when average daily balance is unavailable.
                  primary_recon_error_reason:
                    type: string
                    nullable: true
                    description: The main reason the period did not reconcile, such as a balance mismatch or missing transactions. Returns null when the period reconciled.
                  secondary_recon_error_reason:
                    type: string
                    nullable: true
                    description: An additional reason contributing to the reconciliation failure, where available. Returns null when the period reconciled or when no secondary reason is identified.
                  high_amount_average_daily_balance:
                    type: boolean
                    nullable: true
                    description: Returns `true` if the average daily balance for this period is unusually high compared to typical activity. May indicate large deposits or infrequent withdrawals.
                  balance_ending_with_zero:
                    type: boolean
                    nullable: true
                    description: Returns `true` if the account balance reached zero at the end of this period. May indicate the account was fully drawn down.
                  high_txns_count_atm_over_cash:
                    type: boolean
                    nullable: true
                    description: Returns `true` if the number of ATM transactions is disproportionately high relative to cash transactions during this period.
                  has_weekend_transactions:
                    type: boolean
                    nullable: true
                    description: Returns `true` if any transactions occurred on weekends during this period. Useful for identifying business type and activity patterns.
                  no_txn_in_weekdays_within_period:
                    type: boolean
                    nullable: true
                    description: Returns `true` if no transactions were recorded on weekdays during this period. May indicate account inactivity or an unusual cash flow pattern.
                  high_txns_amount_atm_over_cash:
                    type: boolean
                    nullable: true
                    description: Returns `true` if the total amount of ATM transactions is disproportionately high relative to cash transactions during this period.
        number_of_docs_in_book:
          type: integer
          description: The total count of <<glossary:Document>>s uploaded to this <<glossary:Book>>.
        number_of_docs_processed:
          type: integer
          description: The total count of <<glossary:Document>>s in this <<glossary:Book>> that completed verification.
        uploaded_docs:
          type: array
          description: An array of objects containing information on the <<glossary:Document>>s uploaded to this <<glossary:Book>>.
          items:
            type: object
            properties:
              pk:
                type: integer
                description: Unique personal key for the <<glossary:Document>>.
              uuid:
                type: string
                description: Universal unique identifier for the <<glossary:Document>>.
              status:
                type: string
                description: Processing status of the <<glossary:Document>>.
              pages:
                type: integer
                description: The total number of pages present in the <<glossary:Document>>.
              mixed_uploaded_doc_pk:
                type: integer
                description: Unique personal key for the uploaded Mixed Document associated with this Document. A Mixed Document is a single or multipage PDF that contains more than one doc type.
              mixed_uploaded_doc_uuid:
                type: string
                description: Universal unique identifier for the uploaded Mixed Document associated with this Document. A Mixed Document is a single or multipage PDF that contains more than one doc type.
              rejection_reason:
                type: string
                description: An optional attribute that briefly explains why a Document was rejected.
        book_uuid:
          type: integer
          description: A unique numerical identifier for a <<glossary:Book>>, commonly referred to as the Book UUID.
          example: caaa57ba-8909-4a05-9dcc-e7cc057e3c48
    SuccessCashFlowFeaturesSchema:
      description: 'A detailed analysis of inflows and outflows of money to a bank account.

        '
      required:
      - book_uuid
      - book_end_month
      - book_start_month
      - num_of_months
      - cash_flow_features
      properties:
        book_uuid:
          type: string
          format: uuid
          description: 'The unique identifier of the <<glossary:Book>> that was analyzed.

            '
        book_start_month:
          type: string
          format: date
          description: 'The first day of the first month included by this book''s bank statements. Will be in standard `YYYY-MM-DD` format, where `DD` is always `01`.

            '
        book_end_month:
          type: string
          format: date
          description: 'The first day of the last month included by this book''s bank statements. Will be in standard `YYYY-MM-DD` format, where `DD` is always `01`.

            '
        num_of_months:
          type: number
          minimum: 0
          description: 'The length of time spanned by the analyzed bank statements, in months.

            '
        cash_flow_features:
          type: array
          description: 'A feature vector that describes the cash flow within the specified <<glossary:Book>>. Suitable for use in popular data science libraries such as Pandas, although it can be used anywhere.

            '
          properties:
            credit_avg_1m:
              type: number
              example:
              - 6754.51
              description: 'Credits (deposits) in the most recent calendar month.

                '
            credit_avg_3m:
              type: number
              example:
              - 25286.33
              description: 'Average credits (deposits) across the three most recent calendar months.

                '
            credit_min_3m:
              type: number
              example:
              - 6754.51
              description: 'Minimum credits (deposits) across the three most recent calendar months.

                '
            credit_max_3m:
              type: number
              example:
              - 47946.76
              description: 'Maximum credits (deposits) across the three most recent calendar months.

                '
            credit_std_3m:
              type: number
              example:
              - 17068.19
              description: 'Volatility of credits (deposits) across the three most recent calendar months.

                '
            credit_cv_3m:
              type: number
              example:
              - 0.67
              description: 'Standardized volatility of credits (deposits) across the three most recent calendar months.

                '
            debit_avg_1m:
              type: number
              example:
