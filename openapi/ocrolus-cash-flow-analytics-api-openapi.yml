  /v2/book/{book_uuid}/cash_flow_risk_score:
    get:
      summary: Risk score
      operationId: risk-score
      tags:
      - Cash Flow Analytics
      description: "This API retrieves the Risk Score of a Book in JSON format. The Ocrolus Risk Score offers a highly analytical approach to predicting the probability of default for borrowers based on cash flow analytics. This endpoint offers the following benefits:\n\n- Make quicker, more accurate lending decisions backed by data - Leverage alternative data effectively to gain a complete view of borrowers and speed up decision making\n\n- Mitigate credit risk - Easily identifying borrowers that are likely to default with the necessary level of context to understand contributors and detractors\n\n- Expand access to credit and approve more loans for borrowers - Having insight into borrowers’ finances and associated risk can help you see opportunities where others only see risk\n\n### Async processing \n\nThis API supports asynchronous processing. To get the asynchronous result, add `async=true` in the query parameter to run the request as a background job and receive a `job_id` immediately instead of waiting for the full response inline. When `async=true`, the endpoint returns `202 Accepted` with a `job_id` instead of the analytics payload.\n    \nAsync mode is required for Books with more than 100,000 transactions. Books exceeding 1,000,000 transactions are rejected with `422` (error code `1100`). Once submitted, poll\n[Async job status](https://docs.ocrolus.com/reference/async-job-status) API to retrieve the result when the job is complete.\n"
      parameters:
      - name: book_uuid
        in: path
        required: true
        description: 'The unique identifier of the <<glossary:Book>> that you''d like to analyze.

          '
        schema:
          type: string
          format: uuid
        example: 3927d5b7-ca34-4882-b23f-0ce40d40027c
      - $ref: '#/components/parameters/AsyncParameter'
      x-readme:
        samples-languages:
        - curl
        - python
        explorer-enabled: false
      responses:
