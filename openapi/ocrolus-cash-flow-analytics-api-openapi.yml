  /v2/book/{book_uuid}/cash_flow_features:
    get:
      summary: Cash flow features
      operationId: cash-flow-features
      description: "This API retrieves pre-engineered analytics on a series of bank statements within a <<glossary:Book>> with an object structure that’s suitable for modeling applications.\n> \U0001F4D8 Note \n  > ***Min_days_to_include**: Minimum number of days required for the most recent calendar month to be included in monthly cash flow calculations. The default value is `0`. If the value is set to **32**, only fully completed months are included.\n\n---\n### Async processing \nThis API supports asynchronous processing. To get the asynchronous result, add `async=true` in the query parameter to run the request as a background job and receive a `job_id` immediately instead of waiting for the full response inline. When `async=true`, the endpoint returns `202 Accepted` with a `job_id` instead of the analytics payload.\n  \nAsync mode is required for Books with more than 100,000 transactions. Books exceeding 1,000,000 transactions are rejected with `422` (error code `1100`). Once submitted, poll [Async job status](https://docs.ocrolus.com/reference/async-job-status) API to retrieve the result when the job is complete.\n"
      tags:
      - Cash Flow Analytics
      parameters:
      - name: book_uuid
        in: path
        required: true
        description: 'The unique identifier of the <<glossary:Book>> that you''d like to analyze. All bank statements in this Book will be analyzed, and other documents will be ignored.

          '
        schema:
          type: string
          format: uuid
        example: 3927d5b7-ca34-4882-b23f-0ce40d40027c
      - $ref: '#/components/parameters/AsyncParameter'
      x-readme:
        samples-languages:
        - curl
        - python
        explorer-enabled: true
