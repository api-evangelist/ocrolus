                description: Daily cash balance trend of 30 days. The calculation formula is `((Mean cash balance over first 15 days ) - (Mean cash balance over last 15 days) ) / standard deviation of cash balance over the period`.
              cash_balance_trend_60d:
                type: number
                description: Daily cash balance trend of 60 days. The calculation formula is `((Mean cash balance over first 30 days ) - (Mean cash balance over last 30 days) ) / standard deviation of cash balance over the period`.
              cash_balance_trend_90d:
                type: number
                description: Daily cash balance trend of 90 days. The calculation formula is `((Mean cash balance over first 45 days ) - (Mean cash balance over last 45 days) ) / standard deviation of cash balance over the period`.
              cash_flow_trend_30d:
                type: number
                description: Daily cash flow trend of 30 days. The calculation formula is `((Mean cash flow over first 15 days ) - (Mean cash flow over last 15 days) ) / standard deviation of cash flow over the period`.
              cash_flow_trend_60d:
                type: number
                description: Daily cash flow trend of 60 days. The calculation formula is `((Mean cash flow over first 30 days ) - (Mean cash flow over last 30 days) ) / standard deviation of cash flow over the period`.
              cash_flow_trend_90d:
                type: number
                description: Daily cash flow trend of 90 days.  The calculation formula is `((Mean cash flow over first 45 days ) - (Mean cash flow over last 45 days) ) / standard deviation of cash flow over the period`.
