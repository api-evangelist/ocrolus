aid: ocrolus
name: Ocrolus
description: 'Ocrolus is a fintech document-automation and analytics platform that helps lenders analyze
  financial documents - bank statements, pay stubs, tax forms and more - with high accuracy. Its API covers
  Classify, Capture, Detect and Analyze: document classification and data extraction, fraud and authenticity
  detection, cash-flow analytics, income calculation for mortgage and SMB/consumer lending, business verification,
  tag management and webhooks. Authentication is OAuth 2.0 client credentials issuing JWT access tokens,
  over a REST API at api.ocrolus.com.'
