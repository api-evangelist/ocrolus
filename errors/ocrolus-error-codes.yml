- status: 422
  meaning: Unprocessable entity (e.g. book transaction limit exceeded)
- status: 425
  meaning: Too early - analytics still processing, retry momentarily
- status: 429
  meaning: Too many requests - rate limit exceeded (20 req/s per organization)
- status: 500
  meaning: Internal server error
